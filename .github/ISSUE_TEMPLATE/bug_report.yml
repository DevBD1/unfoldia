name: Bug report
description: Report a reproducible problem in Unfoldia.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "For sensitive findings, follow [SECURITY.md](https://github.com/DevBD1/unfoldia/blob/main/SECURITY.md). Do not include secrets or learner data."
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the lab URL, language, and smallest reproducible sequence.
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, operating system, and screen size
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and accessibility impact
      description: Optional screenshots or sanitized errors; mention keyboard or WebGL behavior when relevant.
